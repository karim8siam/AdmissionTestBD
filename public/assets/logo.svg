<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldTassel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.12)"/>
    </linearGradient>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#logoBg)" filter="url(#glowShadow)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#shieldBorder)" stroke-width="1.5"/>

  <!-- Academic Excellence Star -->
  <path d="M32 8.5 L33.2 12.3 L37 13.5 L33.2 14.7 L32 18.5 L30.8 14.7 L27 13.5 L30.8 12.3 Z" fill="url(#goldTassel)"/>

  <!-- Graduation Cap (Mortarboard Top Diamond) -->
  <polygon points="32,16 51,24.5 32,33 13,24.5" fill="#ffffff"/>

  <!-- Cap Crown / Skullcap -->
  <path d="M19.5 28 V33.5 C19.5 38 32 40.5 32 40.5 C32 40.5 44.5 38 44.5 33.5 V28 L32 33 Z" fill="#e2e8f0"/>

  <!-- Golden Tassel hanging from center to right -->
  <circle cx="32" cy="24.5" r="1.8" fill="url(#goldTassel)"/>
  <path d="M32 24.5 Q45.5 27.5 45.5 35.5" stroke="url(#goldTassel)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="45.5" cy="36.5" r="2.2" fill="url(#goldTassel)"/>

  <!-- Open Textbook Pages (Base of Knowledge) -->
  <path d="M16 43.5 Q32 39.5 32 46.5 Q32 39.5 48 43.5 V48.5 Q32 44.5 32 51.5 Q32 44.5 16 48.5 Z" fill="#ffffff" opacity="0.96"/>
  <path d="M32 46.5 V51.5" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/>
</svg>